services:
  # 1. Morrow Web Server & Background Worker (100% Free Plan, No Credit Card)
  - type: web
    name: morrow-web
    runtime: docker
    dockerfilePath: Dockerfile
    dockerCommand: sh -c "bundle exec rake db:chatwoot_prepare && (bundle exec sidekiq -C config/sidekiq.yml &) && bundle exec rails server -b 0.0.0.0 -p $PORT"
    plan: free
    region: frankfurt
    healthCheckPath: /api
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: INSTALLATION_ENV
        value: docker
      - key: INSTALLATION_NAME
        value: Morrow
      - key: BRAND_NAME
        value: Morrow
      - key: BRAND_URL
        value: https://morrow.money
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: FRONTEND_URL
        value: https://morrow-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: morrow-db
          property: connectionString
      - key: REDIS_URL
        sync: false

databases:
  # 2. PostgreSQL Database (100% Free Plan, No Credit Card)
  - name: morrow-db
    databaseName: chatwoot_production
    user: chatwoot
    plan: free
    region: frankfurt
