services:
  # 1. Morrow Console Web Server (Rails UI & API)
  - type: web
    name: morrow-console-web
    runtime: docker
    dockerfilePath: docker/Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /api
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: INSTALLATION_ENV
        value: docker
      - key: INSTALLATION_NAME
        value: Morrow Console
      - key: BRAND_NAME
        value: Morrow
      - key: BRAND_URL
        value: https://morrow.money
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: morrow-console-web
          property: url
      - key: DATABASE_URL
        fromDatabase:
          name: morrow-console-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: morrow-console-redis
          property: connectionString

  # 2. Background Queue Worker (Sidekiq)
  - type: worker
    name: morrow-console-worker
    runtime: docker
    dockerfilePath: docker/Dockerfile
    dockerCommand: bundle exec sidekiq -C config/sidekiq.yml
    plan: starter
    region: frankfurt
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: INSTALLATION_ENV
        value: docker
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: morrow-console-web
          envVarKey: SECRET_KEY_BASE
      - key: FRONTEND_URL
        fromService:
          type: web
          name: morrow-console-web
          property: url
      - key: DATABASE_URL
        fromDatabase:
          name: morrow-console-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: morrow-console-redis
          property: connectionString

  # 3. Redis Instance
  - type: keyvalue
    name: morrow-console-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction

databases:
  # 4. PostgreSQL Database
  - name: morrow-console-db
    databaseName: chatwoot_production
    user: chatwoot
    plan: starter
    region: frankfurt
